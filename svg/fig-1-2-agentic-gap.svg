<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 2-2 能力不等于可用 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">能力不等于可用：智力指数与 Agentic Index 的落差</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">智力分数奖励"一次思考答对难题" · 智能体分数奖励"几十轮不漂移地完成任务"</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <text x="64" y="116" font-size="10.5" fill="#1B4593">综合智力指数</text>
    <rect x="150" y="106" width="12" height="12" fill="#1B4593" />
    <text x="170" y="116" font-size="10.5" fill="#475569">智力</text>
    <text x="210" y="116" font-size="10.5" fill="#08A6F6">Agentic Index</text>
    <rect x="296" y="106" width="12" height="12" fill="#08A6F6" />
    <text x="1216" y="116" font-size="10.5" fill="#64748B" text-anchor="end">落差（智能体 − 智力）</text>

    <text x="64" y="164" font-size="12" font-weight="bold" fill="#0C2864">模型 A</text>
    <text x="64" y="182" font-size="10.5" fill="#64748B">综合智力排名前五</text>
    <rect x="260" y="146" width="548" height="20" fill="#1B4593" />
    <rect x="260" y="172" width="220" height="20" fill="#08A6F6" />
    <text x="1116" y="168" font-size="17" font-weight="bold" fill="#DF203C" text-anchor="end">−9.7</text>

    <text x="64" y="226" font-size="12" font-weight="bold" fill="#0C2864">模型 B</text>
    <text x="64" y="244" font-size="10.5" fill="#64748B">低价档</text>
    <rect x="260" y="208" width="463" height="20" fill="#1B4593" />
    <rect x="260" y="234" width="169" height="20" fill="#08A6F6" />
    <text x="1116" y="230" font-size="17" font-weight="bold" fill="#DF203C" text-anchor="end">−8.7</text>

    <text x="64" y="288" font-size="12" font-weight="bold" fill="#0C2864">模型 C</text>
    <text x="64" y="306" font-size="10.5" fill="#64748B">智力指数全表第一</text>
    <rect x="260" y="270" width="700" height="20" fill="#1B4593" />
    <rect x="260" y="296" width="551" height="20" fill="#08A6F6" />
    <text x="1116" y="292" font-size="17" font-weight="bold" fill="#DF203C" text-anchor="end">−4.3</text>

    <text x="64" y="350" font-size="12" font-weight="bold" fill="#0C2864">模型 D</text>
    <text x="64" y="368" font-size="10.5" fill="#64748B">厂商默认推荐</text>
    <rect x="260" y="332" width="612" height="20" fill="#1B4593" />
    <rect x="260" y="358" width="480" height="20" fill="#08A6F6" />
    <text x="1116" y="354" font-size="17" font-weight="bold" fill="#DF203C" text-anchor="end">−3.9</text>

    <text x="64" y="412" font-size="12" font-weight="bold" fill="#0C2864">模型 E</text>
    <text x="64" y="430" font-size="10.5" fill="#64748B">中等价位</text>
    <rect x="260" y="394" width="536" height="20" fill="#1B4593" />
    <rect x="260" y="420" width="463" height="20" fill="#08A6F6" />
    <text x="1116" y="416" font-size="17" font-weight="bold" fill="#DF203C" text-anchor="end">−2.2</text>

    <text x="64" y="474" font-size="12" font-weight="bold" fill="#0C2864">模型 F</text>
    <text x="64" y="492" font-size="10.5" fill="#64748B">开放权重 · 最便宜</text>
    <rect x="260" y="456" width="422" height="20" fill="#1B4593" />
    <rect x="260" y="482" width="446" height="20" fill="#08A6F6" />
    <text x="1116" y="478" font-size="17" font-weight="bold" fill="#08A6F6" text-anchor="end">＋0.7</text>

    <line x1="260" y1="516" x2="960" y2="516" stroke="#D8E4F0" stroke-width="1" />
    <text x="260" y="536" font-size="10.5" fill="#94A3B8">45</text>
    <text x="960" y="536" font-size="10.5" fill="#94A3B8" text-anchor="end">66</text>
    <text x="64" y="536" font-size="10.5" fill="#64748B">指数满分 100，此处截断展示</text>

    <rect x="64" y="562" width="1152" height="72" rx="8" fill="#0C2864" />
    <text x="640" y="592" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">唯一一个"Agentic Index 高于智力指数"的模型，是最便宜的那个</text>
    <text x="640" y="620" font-size="12" fill="#B9CCE4" text-anchor="middle">要建智能体就按智能体分数筛选——模型 A 按智力进前五，按智能体分数落在五个更便宜的模型之后</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">数据来源：独立评测机构单一时间快照 · 模型型号与价格更新极快，此处只保留落差关系 · 指数方法论会变化，跨期比较需谨慎</text>
    <text x="1216" y="672" font-size="11" fill="#94A3B8" text-anchor="end">分数属于"模型+harness"组合，不属于模型</text>
  </g>
</svg>
