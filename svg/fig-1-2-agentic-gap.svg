<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 1-2 榜单成绩不等于任务成功率：通用评测与项目任务评估的分工 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">榜单成绩，不等于你的任务成功率</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">单轮解题答得好，不等于几十轮工具调用不跑偏</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <rect x="64" y="104" width="552" height="336" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="88" y="144" font-size="18" font-weight="bold" fill="#0C2864">通用评测：公开榜单</text>
    <rect x="88" y="172" width="8" height="8" fill="#2064AE" />
    <text x="108" y="181" font-size="14" fill="#475569">公开任务，任何人可复跑</text>
    <rect x="88" y="210" width="8" height="8" fill="#2064AE" />
    <text x="108" y="219" font-size="14" fill="#475569">固定评分与公开排名</text>
    <rect x="88" y="248" width="8" height="8" fill="#2064AE" />
    <text x="108" y="257" font-size="14" fill="#475569">用途：在众多模型里帮助初筛</text>
    <rect x="88" y="286" width="8" height="8" fill="#DF203C" />
    <text x="108" y="295" font-size="14" fill="#475569">局限：题目不来自你的业务场景</text>
    <rect x="88" y="324" width="8" height="8" fill="#DF203C" />
    <text x="108" y="333" font-size="14" fill="#475569">分数随版本与口径变化，跨期比较需谨慎</text>
    <text x="88" y="392" font-size="12" fill="#64748B">测的多是"能否答对这道题"</text>

    <rect x="664" y="104" width="552" height="336" rx="10" fill="#F5F8FC" stroke="#2064AE" stroke-width="1.5" />
    <text x="688" y="144" font-size="18" font-weight="bold" fill="#0C2864">项目任务评估：你自己的试金石</text>
    <rect x="688" y="172" width="8" height="8" fill="#2064AE" />
    <text x="708" y="181" font-size="14" fill="#475569">从你的仓库取有代表性的任务</text>
    <rect x="688" y="210" width="8" height="8" fill="#2064AE" />
    <text x="708" y="219" font-size="14" fill="#475569">固定运行时与预算</text>
    <rect x="688" y="248" width="8" height="8" fill="#2064AE" />
    <text x="708" y="257" font-size="14" fill="#475569">同一任务重复执行多次</text>
    <rect x="688" y="286" width="8" height="8" fill="#2064AE" />
    <text x="708" y="295" font-size="14" fill="#475569">检查成功率、成本与越权行为</text>
    <rect x="688" y="324" width="8" height="8" fill="#2064AE" />
    <text x="708" y="333" font-size="14" fill="#475569">验收标准来自你的业务，不是榜单</text>
    <text x="688" y="392" font-size="12" fill="#64748B">看的是"能否选工具、读结果、处理失败、不跑偏"</text>

    <rect x="64" y="470" width="1152" height="54" rx="8" fill="#EEF4FB" stroke="#2064AE" stroke-width="1.5" />
    <text x="640" y="504" font-size="15" font-weight="bold" fill="#0C2864" text-anchor="middle">先初筛，再在自己的任务上对照验证</text>

    <rect x="64" y="548" width="1152" height="64" rx="8" fill="#0C2864" />
    <text x="640" y="576" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">不同指数不直接相减；评估对象是模型与运行时的组合</text>
    <text x="640" y="600" font-size="11.5" fill="#B9CCE4" text-anchor="middle">要建智能体，就按智能体能力筛，不要按智力分数筛</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">来源：本书方法整理，非模型排名数据</text>
    <text x="1216" y="672" font-size="11" fill="#94A3B8" text-anchor="end">读榜纪律与自有评测集的做法见第 3 章 3.3</text>
  </g>
</svg>
