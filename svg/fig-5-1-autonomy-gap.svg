<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 9-1 自主性鸿沟与瓶颈迁移 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">自主性鸿沟与瓶颈迁移</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">几乎一切都在被宣传为"agentic"，企业里绝大多数采用仍停留在"辅助"</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <rect x="64" y="100" width="596" height="452" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="84" y="134" font-size="14" font-weight="bold" fill="#0C2864">自主性鸿沟：AI 到底被用在哪一档</text>
    <text x="84" y="154" font-size="10.5" fill="#64748B">企业级研究对 AI 使用形态的分类</text>
    <text x="200" y="194" font-size="10.5" fill="#475569" text-anchor="end">个体开发者助手</text>
    <rect x="210" y="180" width="399" height="24" fill="#B9CCE4" />
    <text x="617" y="198" font-size="12" font-weight="bold" fill="#0C2864">47.20%</text>
    <text x="200" y="238" font-size="10.5" fill="#475569" text-anchor="end">受监督的智能体</text>
    <rect x="210" y="224" width="155" height="24" fill="#7FA8D9" />
    <text x="373" y="242" font-size="12" font-weight="bold" fill="#0C2864">18.36%</text>
    <text x="200" y="282" font-size="10.5" fill="#475569" text-anchor="end">半自主智能体</text>
    <rect x="210" y="268" width="115" height="24" fill="#3D86D4" />
    <text x="333" y="286" font-size="12" font-weight="bold" fill="#0C2864">13.59%</text>
    <text x="200" y="326" font-size="10.5" fill="#DF203C" text-anchor="end">端到端自主智能体</text>
    <rect x="210" y="312" width="49" height="24" fill="#DF203C" />
    <text x="267" y="330" font-size="12" font-weight="bold" fill="#DF203C">5.84%</text>

    <line x1="84" y1="356" x2="640" y2="356" stroke="#D8E4F0" stroke-width="1" />
    <text x="84" y="382" font-size="12" font-weight="bold" fill="#0C2864">AI 在研发各环节的渗透率</text>
    <text x="200" y="414" font-size="10.5" fill="#475569" text-anchor="end">代码生成</text>
    <rect x="210" y="402" width="280" height="18" fill="#2064AE" />
    <text x="498" y="416" font-size="10.5" font-weight="bold" fill="#0C2864">40.17%</text>
    <text x="200" y="442" font-size="10.5" fill="#475569" text-anchor="end">代码评审</text>
    <rect x="210" y="430" width="262" height="18" fill="#2064AE" />
    <text x="480" y="444" font-size="10.5" font-weight="bold" fill="#0C2864">37.66%</text>
    <text x="200" y="470" font-size="10.5" fill="#475569" text-anchor="end">测试</text>
    <rect x="210" y="458" width="195" height="18" fill="#3D86D4" />
    <text x="413" y="472" font-size="10.5" font-weight="bold" fill="#0C2864">28.01%</text>
    <text x="200" y="498" font-size="10.5" fill="#475569" text-anchor="end">持续集成与交付操作</text>
    <rect x="210" y="486" width="92" height="18" fill="#7FA8D9" />
    <text x="310" y="500" font-size="10.5" font-weight="bold" fill="#0C2864">13.23%</text>
    <text x="200" y="526" font-size="10.5" fill="#DF203C" text-anchor="end">部署决策</text>
    <rect x="210" y="514" width="43" height="18" fill="#DF203C" />
    <text x="261" y="528" font-size="10.5" font-weight="bold" fill="#DF203C">6.20%</text>
    <text x="84" y="544" font-size="10.5" fill="#64748B">大家愿意让 AI 写代码、看代码；一旦接近基础设施与生产凭据，态度就变得极度谨慎</text>

    <rect x="680" y="100" width="536" height="452" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="700" y="134" font-size="14" font-weight="bold" fill="#0C2864">瓶颈迁移：评审成了新的堵点</text>
    <text x="700" y="154" font-size="10.5" fill="#64748B">一项覆盖 802 名开发者、196,212 个合并请求、28 个月的纵向研究</text>
    <rect x="700" y="174" width="496" height="104" rx="8" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="1.5" />
    <text x="724" y="216" font-size="22" font-weight="bold" fill="#2064AE">2.09 倍</text>
    <text x="830" y="216" font-size="12" font-weight="bold" fill="#0C2864">人均合并请求吞吐</text>
    <text x="724" y="248" font-size="10.5" fill="#475569">强制翻倍政策下的实测结果——目前公开可见的最大规模实地提升之一</text>
    <rect x="700" y="294" width="496" height="104" rx="8" fill="#FFFFFF" stroke="#DF203C" stroke-width="1.5" />
    <text x="724" y="336" font-size="22" font-weight="bold" fill="#DF203C">翻倍</text>
    <text x="800" y="336" font-size="12" font-weight="bold" fill="#0C2864">每位评审者承担的负载</text>
    <text x="724" y="368" font-size="10.5" fill="#475569">机器评审的数量超过了人工评审；合并率与回滚率保持稳定</text>
    <rect x="700" y="414" width="496" height="104" rx="8" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="724" y="456" font-size="22" font-weight="bold" fill="#DF203C">4.6 倍</text>
    <text x="830" y="456" font-size="12" font-weight="bold" fill="#0C2864">评审队列中的等待时长</text>
    <text x="724" y="488" font-size="10.5" fill="#475569">AI 生成合并请求相对普通请求的等待倍数（LinearB 2026：810 万条合并请求）</text>

    <rect x="64" y="574" width="1152" height="58" rx="8" fill="#0C2864" />
    <text x="640" y="600" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">那篇论文的标题本身就是结论：AI 写代码的速度超过了人类读代码的速度</text>
    <text x="640" y="622" font-size="12" fill="#B9CCE4" text-anchor="middle">评审容量从此不是管理细节，而是一项生产要素</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">数据来源：企业级 AI 使用形态研究（2026）· 802 名开发者纵向研究（2026-07）· LinearB 2026 基准（810 万条合并请求 / 4,800 家团队）</text>
  </g>
</svg>
