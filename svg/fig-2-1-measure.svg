<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 2-1 感受与事实：三种落差 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">感受与事实：三种落差</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">同一个工具，在三种测量口径下可以给出三种相反的结论</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <rect x="64" y="106" width="360" height="346" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="244" y="140" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">落差一 · 感知与事实</text>
    <text x="244" y="162" font-size="11" fill="#64748B" text-anchor="middle">同一随机对照实验 · 两种口径</text>
    <text x="100" y="196" font-size="10.5" fill="#64748B">原文怎么问</text>
    <text x="284" y="196" font-size="10.5" fill="#64748B">折成耗时</text>
    <line x1="272" y1="206" x2="272" y2="344" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4" />
    <text x="84" y="232" font-size="12" fill="#475569">预测：提速 24%</text>
    <text x="284" y="232" font-size="14" font-weight="bold" fill="#0C2864">−19.4%</text>
    <text x="84" y="276" font-size="12" fill="#475569">自评：提速 20%</text>
    <text x="284" y="276" font-size="14" font-weight="bold" fill="#0C2864">−16.7%</text>
    <text x="84" y="320" font-size="12" fill="#475569">实测：完成时间</text>
    <text x="284" y="320" font-size="14" font-weight="bold" fill="#DF203C">＋19%（原值）</text>
    <text x="284" y="340" font-size="10.5" fill="#94A3B8">实测本就是耗时口径</text>
    <text x="84" y="366" font-size="10.5" fill="#64748B">提速口径未折算；折算规则见正文 4.3 折算表</text>
    <line x1="88" y1="382" x2="400" y2="382" stroke="#D8E4F0" stroke-width="1" />
    <text x="244" y="408" font-size="12" font-weight="bold" fill="#DF203C" text-anchor="middle">自评、预测对实测的落差约 36 / 38 个百分点</text>
    <text x="244" y="428" font-size="10.5" fill="#64748B" text-anchor="middle">资深开发者 · 自己的成熟仓库 · 246 个真实任务</text>
    <text x="244" y="446" font-size="10.5" fill="#475569" text-anchor="middle">对明确、局部、易验证的任务，结论并不相同</text>

    <rect x="460" y="106" width="360" height="346" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="640" y="140" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">落差二 · 投入与回报不同步</text>
    <text x="640" y="162" font-size="11" fill="#64748B" text-anchor="middle">收益是否兑现，取决于口径与假设</text>
    <rect x="480" y="186" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="498" y="214" font-size="12.5" font-weight="bold" fill="#0C2864">① 记录工具与学习投入</text>
    <polygon points="632,234 648,234 640,244" fill="#94A3B8" />
    <rect x="480" y="248" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="498" y="276" font-size="12.5" font-weight="bold" fill="#0C2864">② 记录交付、返工与故障</text>
    <polygon points="632,296 648,296 640,306" fill="#94A3B8" />
    <rect x="480" y="310" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="498" y="338" font-size="12.5" font-weight="bold" fill="#0C2864">③ 按明确假设核算，写出公式</text>
    <text x="640" y="388" font-size="12" font-weight="bold" fill="#2064AE" text-anchor="middle">方法示意，不承诺回收期</text>
    <text x="640" y="412" font-size="10.5" fill="#64748B" text-anchor="middle">ROI 类数字先问口径：分母是什么、周期是哪一段、返工算没算</text>
    <text x="640" y="436" font-size="10.5" fill="#475569" text-anchor="middle">投入与回报要按同一口径核算，才谈得上同步</text>

    <rect x="856" y="106" width="360" height="346" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="1036" y="140" font-size="14" font-weight="bold" fill="#0C2864" text-anchor="middle">落差三 · 任务条件不同</text>
    <text x="1036" y="162" font-size="11" fill="#64748B" text-anchor="middle">同一工具，不同任务，结论可以相反</text>
    <rect x="880" y="190" width="312" height="64" rx="8" fill="#FFFFFF" stroke="#08A6F6" stroke-width="1.5" />
    <text x="900" y="216" font-size="13" font-weight="bold" fill="#0C2864">从零写单一服务</text>
    <text x="900" y="238" font-size="10.5" fill="#64748B">需求具体、验证路径短</text>
    <rect x="880" y="270" width="312" height="64" rx="8" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="1.5" />
    <text x="900" y="296" font-size="13" font-weight="bold" fill="#0C2864">维护熟悉的成熟仓库</text>
    <text x="900" y="318" font-size="10.5" fill="#64748B">隐性约束多、上下文重</text>
    <line x1="880" y1="356" x2="1192" y2="356" stroke="#D8E4F0" stroke-width="1" />
    <text x="1036" y="382" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">不要用一个百分比概括软件工程</text>
    <text x="1036" y="406" font-size="10.5" fill="#64748B" text-anchor="middle">任务类型 · 代码库年龄 · 语言常见度</text>
    <text x="1036" y="428" font-size="10.5" fill="#475569" text-anchor="middle">共同决定结果的方向与幅度</text>

    <rect x="64" y="474" width="1152" height="140" rx="8" fill="#0C2864" />
    <text x="640" y="512" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">度量三问：分母是什么？周期是哪一段？质量与返工算进去了吗？</text>
    <text x="640" y="544" font-size="12" fill="#B9CCE4" text-anchor="middle">先核口径与条件，再判断收益；自评不等于实测</text>
    <text x="640" y="572" font-size="12" fill="#B9CCE4" text-anchor="middle">感知与事实、投入与回报、任务与条件——换一把尺，结论就可能反转</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">数据来源：METR 随机对照实验（2025-07）及 2026-02 跟进 · 中栏与右栏为本书度量方法整理，非实测数据</text>
    <text x="1216" y="672" font-size="11" fill="#94A3B8" text-anchor="end">口径不可互相换算</text>
  </g>
</svg>
