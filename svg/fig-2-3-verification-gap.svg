<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 1-3 验证鸿沟：两条斜率不同的曲线 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">验证鸿沟：两条斜率不同的曲线</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">生成以秒计 · 验证受人力上限约束 · 两线之间的面积就是未被验证的代码</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <rect x="64" y="100" width="596" height="536" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="84" y="134" font-size="14" font-weight="bold" fill="#0C2864">累积生成量 vs 累积验证量</text>
    <text x="84" y="154" font-size="10.5" fill="#64748B">引入编码智能体之后 · 相对示意，用于表达斜率关系</text>

    <text x="130" y="180" font-size="10.5" fill="#94A3B8">累积代码量</text>
    <line x1="498" y1="168" x2="522" y2="168" stroke="#DF203C" stroke-width="3" />
    <text x="528" y="172" font-size="10.5" fill="#DF203C">生成</text>
    <line x1="570" y1="168" x2="594" y2="168" stroke="#0C2864" stroke-width="3" />
    <text x="600" y="172" font-size="10.5" fill="#0C2864">验证</text>

    <line x1="130" y1="280" x2="620" y2="280" stroke="#D8E4F0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="130" y1="380" x2="620" y2="380" stroke="#D8E4F0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="130" y1="480" x2="620" y2="480" stroke="#94A3B8" stroke-width="1" />

    <polygon points="130,476 200,458 270,430 340,394 410,348 480,296 550,246 620,204 620,400 550,408 480,418 410,428 340,440 270,452 200,465" fill="#FBE4E8" />
    <polyline points="130,476 200,458 270,430 340,394 410,348 480,296 550,246 620,204" fill="none" stroke="#DF203C" stroke-width="3" />
    <polyline points="130,476 200,465 270,452 340,440 410,428 480,418 550,408 620,400" fill="none" stroke="#0C2864" stroke-width="3" />

    <line x1="600" y1="216" x2="600" y2="394" stroke="#DF203C" stroke-width="1" stroke-dasharray="4 3" />
    <polygon points="600,210 595,222 605,222" fill="#DF203C" />
    <polygon points="600,400 595,388 605,388" fill="#DF203C" />

    <text x="400" y="302" font-size="10.5" font-weight="bold" fill="#DF203C" text-anchor="middle">生成：秒级产出</text>
    <text x="480" y="364" font-size="12" font-weight="bold" fill="#DF203C" text-anchor="middle">未验证代码堆积</text>
    <text x="452" y="466" font-size="10.5" font-weight="bold" fill="#0C2864" text-anchor="middle">验证：受人力上限约束</text>

    <text x="620" y="502" font-size="10.5" fill="#94A3B8" text-anchor="end">时间 →（引入智能体后的周数）</text>
    <text x="84" y="530" font-size="10.5" fill="#475569">生成曲线的斜率由模型速度决定 · 验证曲线的斜率由评审人力决定</text>
    <text x="84" y="552" font-size="10.5" fill="#475569">两线斜率之差不会自行收敛，只会随生成量的增长而放大</text>
    <rect x="84" y="566" width="556" height="52" rx="8" fill="#EEF4FB" stroke="#2064AE" stroke-width="1.5" />
    <text x="362" y="598" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">验证鸿沟 = 生成速度 − 验证速度（由人力上限封顶）</text>

    <rect x="680" y="100" width="536" height="240" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="700" y="134" font-size="14" font-weight="bold" fill="#0C2864">模块越大，全部正确的概率掉得越快</text>
    <text x="700" y="152" font-size="10.5" fill="#64748B">假设单行正确率 99%——这已经相当乐观</text>
    <line x1="706" y1="300" x2="1196" y2="300" stroke="#D8E4F0" stroke-width="1" />
    <rect x="726" y="172" width="60" height="128" fill="#B9CCE4" />
    <text x="756" y="164" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">90.4%</text>
    <rect x="818" y="214" width="60" height="86" fill="#7FA8D9" />
    <text x="848" y="206" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">60.5%</text>
    <rect x="910" y="248" width="60" height="52" fill="#3D86D4" />
    <text x="940" y="240" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">36.6%</text>
    <rect x="1002" y="293" width="60" height="7" fill="#DF203C" />
    <text x="1032" y="285" font-size="12" font-weight="bold" fill="#DF203C" text-anchor="middle">4.9%</text>
    <rect x="1094" y="298" width="60" height="2" fill="#DF203C" />
    <text x="1124" y="290" font-size="12" font-weight="bold" fill="#DF203C" text-anchor="middle">0.7%</text>
    <text x="756" y="322" font-size="10.5" fill="#475569" text-anchor="middle">10 行</text>
    <text x="848" y="322" font-size="10.5" fill="#475569" text-anchor="middle">50 行</text>
    <text x="940" y="322" font-size="10.5" fill="#475569" text-anchor="middle">100 行</text>
    <text x="1032" y="322" font-size="10.5" fill="#475569" text-anchor="middle">300 行</text>
    <text x="1124" y="322" font-size="10.5" fill="#475569" text-anchor="middle">500 行</text>

    <rect x="680" y="352" width="536" height="204" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="700" y="382" font-size="14" font-weight="bold" fill="#0C2864">鸿沟的三条实测支撑</text>
    <rect x="700" y="396" width="4" height="40" fill="#2064AE" />
    <text x="716" y="416" font-size="12" font-weight="bold" fill="#2064AE">人审速率上限约 400 行 / 小时（SmartBear 研究）</text>
    <text x="716" y="434" font-size="10.5" fill="#475569">这是验证曲线的斜率天花板</text>
    <rect x="700" y="448" width="4" height="40" fill="#3D86D4" />
    <text x="716" y="468" font-size="12" font-weight="bold" fill="#2064AE">审 1 行 $0.243 · 生成 1 行 $0.114</text>
    <text x="716" y="486" font-size="10.5" fill="#475569">读代码比写代码贵 2.1 倍</text>
    <rect x="700" y="500" width="4" height="40" fill="#DF203C" />
    <text x="716" y="520" font-size="12" font-weight="bold" fill="#2064AE">AI 合并请求的评审等待：4.6 倍</text>
    <text x="716" y="538" font-size="10.5" fill="#475569">生成快于阅读，队列必然积压</text>

    <rect x="680" y="572" width="536" height="64" rx="8" fill="#0C2864" />
    <text x="948" y="600" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">填平鸿沟只有两条路：验证前移 + 验证机械化</text>
    <text x="948" y="622" font-size="10.5" fill="#B9CCE4" text-anchor="middle">靠多派人会在成本上撞墙——这是第二篇的全部内容</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">算术口径：0.99ⁿ 为「各行独立」假设下的概率，现实中编译器、测试与反馈循环会兜住一批；两条累积曲线为示意，仅表达斜率关系</text>
    <text x="1216" y="672" font-size="11" fill="#94A3B8" text-anchor="end">数据来源：安全厂商 2026 报告 · 评审成本推算 · 开发者基准测试</text>
  </g>
</svg>
