<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 5-2 四阶十二步与四流闭环 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">组织级参考工艺：四阶十二步与四流闭环</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">把高手的手感显性化、门禁化、可复制化 · 流程决定下限，高手上探上限</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <rect x="64" y="100" width="700" height="520" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="84" y="132" font-size="14" font-weight="bold" fill="#0C2864">四阶十二步：每一步都有输入、产出与验收规则</text>
    <rect x="84" y="146" width="152" height="30" rx="4" fill="#B9CCE4" />
    <text x="160" y="166" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">准备</text>
    <rect x="248" y="146" width="152" height="30" rx="4" fill="#7FA8D9" />
    <text x="324" y="166" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">需求</text>
    <rect x="412" y="146" width="152" height="30" rx="4" fill="#3D86D4" />
    <text x="488" y="166" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">设计</text>
    <rect x="576" y="146" width="168" height="30" rx="4" fill="#2064AE" />
    <text x="660" y="166" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">编码与交付</text>

    <rect x="84" y="188" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="98" y="212" font-size="10.5" fill="#2064AE">1 · 流程初始化</text>
    <text x="98" y="232" font-size="10.5" fill="#475569">无测试环境</text>
    <text x="98" y="244" font-size="10.5" fill="#DF203C">不进入实现</text>

    <rect x="248" y="188" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="262" y="212" font-size="10.5" fill="#2064AE">2 · 业务需求整理</text>
    <text x="262" y="232" font-size="10.5" fill="#475569">边界不清</text>
    <text x="262" y="244" font-size="10.5" fill="#DF203C">不进入 PRD</text>
    <rect x="248" y="256" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="262" y="280" font-size="10.5" fill="#2064AE">3 · 生成产品需求文档</text>
    <text x="262" y="300" font-size="10.5" fill="#475569">规格未确认</text>
    <text x="262" y="312" font-size="10.5" fill="#DF203C">不进入故事</text>
    <rect x="248" y="324" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="262" y="348" font-size="10.5" fill="#2064AE">4 · 人工审需求文档</text>
    <text x="262" y="368" font-size="10.5" fill="#475569">三方共识</text>
    <text x="262" y="380" font-size="10.5" fill="#64748B">业务 + 研发 + AI</text>
    <rect x="248" y="392" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="262" y="416" font-size="10.5" fill="#2064AE">5 · 生成用户故事</text>
    <text x="262" y="436" font-size="10.5" fill="#475569">覆盖异常态</text>
    <text x="262" y="448" font-size="10.5" fill="#64748B">空态与边界态</text>
    <rect x="248" y="460" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="262" y="484" font-size="10.5" fill="#2064AE">6 · 人工审用户故事</text>
    <text x="262" y="504" font-size="10.5" fill="#475569">不可测试</text>
    <text x="262" y="516" font-size="10.5" fill="#DF203C">不进入设计</text>

    <rect x="412" y="188" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="426" y="212" font-size="10.5" fill="#2064AE">7 · 设计与验证计划</text>
    <text x="426" y="232" font-size="10.5" fill="#475569">关键边界不清</text>
    <text x="426" y="244" font-size="10.5" fill="#DF203C">不拆任务</text>
    <rect x="412" y="256" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="426" y="280" font-size="10.5" fill="#2064AE">8 · 人工审设计</text>
    <text x="426" y="300" font-size="10.5" fill="#475569">架构师评审</text>
    <text x="426" y="312" font-size="10.5" fill="#64748B">关键边界</text>
    <rect x="412" y="324" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="426" y="348" font-size="10.5" fill="#2064AE">9 · 任务拆解</text>
    <text x="426" y="368" font-size="10.5" fill="#475569">不可独立验证</text>
    <text x="426" y="380" font-size="10.5" fill="#DF203C">不进入实现</text>

    <rect x="576" y="188" width="168" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="590" y="212" font-size="10.5" fill="#2064AE">10 · 测试驱动编码</text>
    <text x="590" y="232" font-size="10.5" fill="#475569">红灯先行；反复</text>
    <text x="590" y="244" font-size="10.5" fill="#DF203C">失败即升级人工介入</text>
    <rect x="576" y="256" width="168" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="590" y="274" font-size="10.5" fill="#2064AE">11 · 集成与端到端测试</text>
    <text x="590" y="290" font-size="10.5" fill="#475569">只跑单测不算完成</text>
    <text x="590" y="304" font-size="10.5" fill="#DF203C">发布验收验证关键真实链路</text>
    <rect x="576" y="324" width="168" height="60" rx="6" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1" />
    <text x="590" y="348" font-size="10.5" fill="#2064AE">12 · 提交与流水线</text>
    <text x="590" y="368" font-size="10.5" fill="#475569">需求—设计—开发—</text>
    <text x="590" y="380" font-size="10.5" fill="#DF203C">测试全通过才许合入</text>

    <rect x="84" y="534" width="660" height="70" rx="8" fill="#FDF3E3" stroke="#B9770E" stroke-width="1" />
    <text x="104" y="560" font-size="12" font-weight="bold" fill="#B9770E">裁剪是常态，不是例外</text>
    <text x="104" y="584" font-size="10.5" fill="#475569">原则不是"步骤越少越好"，而是"每一步都有人负责验证"——某核心系统项目把它裁剪为三阶段七步</text>

    <rect x="784" y="100" width="432" height="520" rx="10" fill="#F5F8FC" stroke="#D8E4F0" stroke-width="1.5" />
    <text x="804" y="132" font-size="14" font-weight="bold" fill="#0C2864">四流闭环</text>
    <text x="804" y="152" font-size="10.5" fill="#64748B">为什么有些团队越用越快</text>
    <rect x="804" y="170" width="392" height="86" rx="8" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="1.5" />
    <path d="M809 170.58A8 8 0 0 0 804 178V248A8 8 0 0 0 809 255.42Z" fill="#2064AE"/>
    <text x="826" y="198" font-size="12" font-weight="bold" fill="#2064AE">任务流 · 生产主线</text>
    <text x="826" y="222" font-size="10.5" fill="#475569">把产品做出来：需求 → 设计 → 开发 →</text>
    <text x="826" y="242" font-size="10.5" fill="#475569">验证 → 部署，每步有输入、产出与验证规则</text>
    <polygon points="992,262 1002,272 992,282" fill="#94A3B8" />
    <rect x="804" y="288" width="392" height="86" rx="8" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="1.5" />
    <path d="M809 288.58A8 8 0 0 0 804 296V366A8 8 0 0 0 809 373.42Z" fill="#3D86D4"/>
    <text x="826" y="316" font-size="12" font-weight="bold" fill="#2064AE">洞察流 · 观察线</text>
    <text x="826" y="340" font-size="10.5" fill="#475569">看清生产线的运行状况：汇聚全链路数据，</text>
    <text x="826" y="360" font-size="10.5" fill="#475569">定位瓶颈、异常与浪费</text>
    <polygon points="992,380 1002,390 992,400" fill="#94A3B8" />
    <rect x="804" y="406" width="392" height="86" rx="8" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="1.5" />
    <path d="M809 406.58A8 8 0 0 0 804 414V484A8 8 0 0 0 809 491.42Z" fill="#08A6F6"/>
    <text x="826" y="434" font-size="12" font-weight="bold" fill="#2064AE">治理流 · 升级线</text>
    <text x="826" y="458" font-size="10.5" fill="#475569">让工厂越做越好：基于洞察做指标复盘、</text>
    <text x="826" y="478" font-size="10.5" fill="#475569">流程裁剪、规约升级与风险处置</text>
    <polygon points="992,498 1002,508 992,518" fill="#94A3B8" />
    <rect x="804" y="524" width="392" height="80" rx="8" fill="#EEF4FB" stroke="#2064AE" stroke-width="1.5" />
    <path d="M809 524.58A8 8 0 0 0 804 532V596A8 8 0 0 0 809 603.42Z" fill="#1B4593"/>
    <text x="826" y="552" font-size="12" font-weight="bold" fill="#2064AE">资产流 · 沉淀线</text>
    <text x="826" y="576" font-size="10.5" fill="#475569">规格、代码、测试用例与经验结构化入库——</text>
    <text x="826" y="596" font-size="10.5" fill="#DF203C">成为下一轮生产的上下文与养料</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">闭环：任务流 → 洞察流 → 治理流 → 资产流 → 下一轮任务流 · 交付不是终点，每一轮生产都在为下一轮积累能力</text>
  </g>
</svg>
