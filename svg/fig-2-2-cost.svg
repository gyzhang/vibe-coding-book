<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Book Sans, Source Han Sans CN, 思源黑体 CN, sans-serif" font-size="12" data-pptx-page-role="content">
  <!-- 图 1-2 软件生产成本结构的两次迁移 -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="title" data-pptx-bounds="0 14 1280 58">
    <text x="640" y="42" font-size="22" font-weight="bold" fill="#0C2864" text-anchor="middle">软件生产成本结构的两次迁移</text>
    <text x="640" y="66" font-size="11" fill="#64748B" text-anchor="middle">编写代码的占比被压缩 · 验证、设计与维护成为新的成本主体</text>
  </g>
  <g id="content" data-pptx-bounds="40 84 1200 560">
    <text x="330" y="118" font-size="17" font-weight="bold" fill="#0C2864" text-anchor="middle">传统时代</text>
    <text x="330" y="140" font-size="11" fill="#64748B" text-anchor="middle">1990s – 2022</text>
    <text x="950" y="118" font-size="17" font-weight="bold" fill="#2064AE" text-anchor="middle">智能体时代</text>
    <text x="950" y="140" font-size="11" fill="#64748B" text-anchor="middle">2026 起</text>

    <rect x="220" y="392" width="220" height="208" fill="#0C2864" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="330" y="502" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">45%</text>
    <rect x="220" y="323" width="220" height="69" fill="#1B4593" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="330" y="365" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">15%</text>
    <rect x="220" y="240" width="220" height="83" fill="#2064AE" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="330" y="288" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">18%</text>
    <rect x="220" y="185" width="220" height="55" fill="#7FA8D9" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="330" y="218" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">12%</text>
    <rect x="220" y="140" width="220" height="45" fill="#B9CCE4" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="330" y="170" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">10%</text>

    <rect x="840" y="565" width="220" height="35" fill="#0C2864" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="950" y="588" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8%</text>
    <rect x="840" y="464" width="220" height="101" fill="#1B4593" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="950" y="520" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">22%</text>
    <rect x="840" y="271" width="220" height="193" fill="#2064AE" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="950" y="372" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">42%</text>
    <rect x="840" y="185" width="220" height="86" fill="#7FA8D9" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="950" y="233" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">18%</text>
    <rect x="840" y="140" width="220" height="45" fill="#B9CCE4" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="950" y="170" font-size="12" font-weight="bold" fill="#0C2864" text-anchor="middle">10%</text>

    <line x1="130" y1="612" x2="1160" y2="612" stroke="#D8E4F0" stroke-width="1" />
    <rect x="130" y="626" width="10" height="10" fill="#0C2864" />
    <text x="148" y="636" font-size="10.5" fill="#475569">编写</text>
    <rect x="212" y="626" width="10" height="10" fill="#1B4593" />
    <text x="230" y="636" font-size="10.5" fill="#475569">需求与沟通</text>
    <rect x="330" y="626" width="10" height="10" fill="#2064AE" />
    <text x="348" y="636" font-size="10.5" fill="#475569">验证与测试</text>
    <rect x="448" y="626" width="10" height="10" fill="#7FA8D9" />
    <text x="466" y="636" font-size="10.5" fill="#475569">设计</text>
    <rect x="522" y="626" width="10" height="10" fill="#B9CCE4" />
    <text x="540" y="636" font-size="10.5" fill="#475569">维护</text>
    <text x="1216" y="636" font-size="11" font-weight="bold" fill="#DF203C" text-anchor="end">被压缩的只有"编写"这一项</text>
  </g>
  <g id="footnote" data-pptx-bounds="0 650 1280 40">
    <text x="64" y="672" font-size="11" fill="#94A3B8">口径：示意性成本结构（传统时代编码约 45% → 智能体时代约 8%；验证与测试约 18% → 约 42%），仅表达迁移方向；各行经验研究对"编码占生命周期成本比例"的估计区间为 20%–35%</text>
  </g>
</svg>
