  <g id="footnote" data-pptx-bounds="0 600 1280 40">
    <text x="64" y="592" font-size="11" fill="#94A3B8">四个数相加 = 4,194（桌面端 731 / 云端 3,118 / 官网 12 / BetterWork 333），截至各仓库最后一次提交</text>
    <text x="64" y="612" font-size="11" fill="#94A3B8">口径：作者自测，脚本统计，可复现；四个仓库任务类型、语言与成熟度不同，行数描述规模，不描述价值</text>
